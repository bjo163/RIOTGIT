name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --workspace --all-targets
      - run: bash -n scripts/backup.sh scripts/restore.sh scripts/smoke-git-http.sh scripts/smoke-git-ssh.sh
      - name: Git smart HTTP round-trip
        run: bash scripts/smoke-git-http.sh

  web:
    name: Web checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  ssh:
    name: OpenSSH Git transport
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure isolated CI instance
        run: |
          {
            echo "RIOTGIT_API_TOKEN=riotgit-ci-$(openssl rand -hex 32)"
            echo "RIOTGIT_ADMIN_USERNAME=ci-admin"
            echo "RIOTGIT_ADMIN_PASSWORD=R!OTGIT-CI-Admin-Password-1234"
            echo "RIOTGIT_API_PORT=8787"
            echo "RIOTGIT_WEB_PORT=3000"
            echo "RIOTGIT_SSH_PORT=2222"
          } > .env
      - name: Build API and SSH images
        run: docker compose -f deploy/compose/docker-compose.yml --env-file .env --profile ssh build api ssh
      - name: Start API service
        run: docker compose -f deploy/compose/docker-compose.yml --env-file .env up -d --no-build api
      - name: Wait for API readiness
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8787/health/ready >/dev/null; then
              echo "API is ready."
              exit 0
            fi
            sleep 2
          done
          docker compose -f deploy/compose/docker-compose.yml --env-file .env logs --tail=160 api
          exit 1
      - name: Start restricted SSH gateway
        run: docker compose -f deploy/compose/docker-compose.yml --env-file .env --profile ssh up -d --no-build ssh
      - name: Verify SSH clone, push, permissions, and revocation
        run: |
          set -a
          . ./.env
          set +a
          bash scripts/smoke-git-ssh.sh
      - name: Collect service logs on failure
        if: failure()
        run: docker compose -f deploy/compose/docker-compose.yml --env-file .env --profile ssh logs --tail=200 api ssh
      - name: Stop CI services and remove test volumes
        if: always()
        run: docker compose -f deploy/compose/docker-compose.yml --env-file .env --profile ssh down -v --remove-orphans
