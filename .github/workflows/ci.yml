name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-lockfiles:
    name: Generate dependency lockfiles
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@1.99
      - run: cargo generate-lockfile
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Record the exact npm version used for the lockfile
        working-directory: apps/web
        run: npm --version > .npm-version
      - name: Generate npm lockfile
        working-directory: apps/web
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Publish generated lockfiles for inspection
        uses: actions/upload-artifact@v4
        with:
          name: dependency-lockfiles
          path: |
            Cargo.lock
            apps/web/package-lock.json
            apps/web/.npm-version
          if-no-files-found: error
      - name: Commit lockfiles to the same-repository stabilization branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/stabilization-nov20'
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock apps/web/package-lock.json apps/web/.npm-version
          if git diff --cached --quiet; then
            echo "Dependency lockfiles are already up to date."
            exit 0
          fi
          git commit -m "build(deps): commit reproducible dependency lockfiles"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --workspace --all-targets
      - run: bash -n scripts/backup.sh scripts/restore.sh scripts/smoke-git-http.sh scripts/smoke-git-ssh.sh
      - name: Git smart HTTP round-trip
        run: bash scripts/smoke-git-http.sh

  web:
    name: Web checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  ssh:
    name: OpenSSH Git transport
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure isolated CI instance
        run: |
          {
            echo "RIOTGIT_API_TOKEN=riotgit-ci-$(openssl rand -hex 32)"
            echo "RIOTGIT_ADMIN_USERNAME=ci-admin"
            echo "RIOTGIT_ADMIN_PASSWORD=R!OTGIT-CI-Admin-Password-1234"
            echo "RIOTGIT_API_PORT=8787"
            echo "RIOTGIT_WEB_PORT=3000"
            echo "RIOTGIT_SSH_PORT=2222"
          } > .env
      - name: Build API, web, and SSH images
        run: docker compose -f deploy/compose/docker-compose.yml --env-file .env --profile ssh build api web ssh
      - name: Start API and web services
        run: docker compose -f deploy/compose/docker-compose.yml --env-file .env --profile ssh up -d --no-build api web
      - name: Wait for API readiness
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8787/health/ready >/dev/null; then
              echo "API is ready."
              exit 0
            fi
            sleep 2
          done
          docker compose -f deploy/compose/docker-compose.yml --env-file .env logs --tail=160 api
          exit 1
      - name: Wait for web readiness
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/login >/dev/null; then
              echo "Web application is ready."
              exit 0
            fi
            sleep 2
          done
          docker compose -f deploy/compose/docker-compose.yml --env-file .env logs --tail=160 web
          exit 1
      - name: Start restricted SSH gateway
        run: docker compose -f deploy/compose/docker-compose.yml --env-file .env --profile ssh up -d --no-build ssh
      - name: Verify SSH clone, push, permissions, and revocation
        run: |
          set -a
          . ./.env
          set +a
          bash scripts/smoke-git-ssh.sh
      - name: Collect service logs on failure
        if: failure()
        run: docker compose -f deploy/compose/docker-compose.yml --env-file .env --profile ssh logs --tail=200 api ssh
      - name: Stop CI services and remove test volumes
        if: always()
        run: docker compose -f deploy/compose/docker-compose.yml --env-file .env --profile ssh down -v --remove-orphans
